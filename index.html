<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой сюрприз ❤️</title>

<style>

body {
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e7,#fff3f8);
text-align:center;
overflow-x:hidden;
}


#giftScreen {

position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg,#ffb6d9,#ffe8f2);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;

}


.gift {

font-size:110px;
cursor:pointer;
animation:jump 1s infinite;

}


@keyframes jump {

50% {
transform:translateY(-20px);
}

}



.hide {

animation:hide 1s forwards;

}



@keyframes hide {

to {
opacity:0;
visibility:hidden;
}

}



.container {

background:white;
width:85%;
max-width:500px;
margin:40px auto;
padding:25px;
border-radius:30px;
box-shadow:0 10px 30px pink;

}



h1 {

color:#ff4f91;

}


h2 {

color:#ff72ad;

}



button {

background:#ff6fa5;
color:white;
border:0;
padding:15px 25px;
border-radius:30px;
font-size:16px;
margin:10px;
cursor:pointer;

}



.hidden {

display:none;

}



/* Игра */

#gameArea {

height:300px;
background:#fff0f6;
border-radius:20px;
position:relative;
overflow:hidden;

}



.gameHeart {

position:absolute;
font-size:35px;
cursor:pointer;

}



/* Падающие сердечки */

.heart {

position:fixed;
color:#ff6fa5;
animation:fall 5s linear;

}



@keyframes fall {

from {
transform:translateY(-50px);
}

to {
transform:translateY(100vh);
}

}


</style>

</head>


<body>



<div id="giftScreen">

<div class="gift" onclick="openGift()">
🎁
</div>

<h2>
У меня есть кое-что для тебя ❤️
</h2>

<p>
Нажми на подарок ✨
</p>

</div>




<div class="container">


<h1>
❤️ Маленький сюрприз ❤️
</h1>


<h2>
Для самого особенного человека
</h2>



<button onclick="letter()">
💌 Открыть письмо
</button>



<div id="letter" class="hidden">

<h3>
Для тебя ❤️
</h3>

<p>

Я тебя люблю вообще-то ксли ты не знал

</p>

</div>




<button onclick="game()">
🎮 Мини-игра
</button>



<div id="game" class="hidden">

<h3>
Собери сердечки ❤️
</h3>

<p>
Счёт:
<span id="score">0</span>
</p>


<div id="gameArea"></div>


</div>



</div>





<script>


function openGift(){

document
.getElementById("giftScreen")
.classList.add("hide");

}



function letter(){

document
.getElementById("letter")
.style.display="block";

}



function game(){

document
.getElementById("game")
.style.display="block";

createHeart();

}



let score=0;



function createHeart(){

let area=document.getElementById("gameArea");

let heart=document.createElement("div");


heart.innerHTML="❤️";

heart.className="gameHeart";


heart.style.left=Math.random()*250+"px";

heart.style.top=Math.random()*250+"px";



heart.onclick=function(){

score++;

document.getElementById("score").innerHTML=score;

heart.remove();

createHeart();

}



area.appendChild(heart);

}




setInterval(()=>{


let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.fontSize=Math.random()*30+20+"px";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},5000);



},700);



</script>



</body>

</html>
